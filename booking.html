<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book a Service | AJ & TJ IT Solutions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="index.html#services">Services</a>
    <a href="booking.html" class="active">Book Service</a>
    <a href="index.html#contact">Contact</a>
  </nav>

  <!-- PAGE CONTENT -->
  <section class="booking">
    <h1>Book a Service</h1>
    <p>Please fill out the form below and we’ll contact you.</p>

    <form>
      <label>Name</label>
      <input type="text" required />

      <label>Email</label>
      <input type="email" required />

      <label>Service Needed</label>
      <select>
        <option>Computer Repair</option>
        <option>Network / Wi-Fi Setup</option>
        <option>Smart Home</option>
        <option>Custom PC Build</option>
      </select>

      <label>Preferred Date</label>
      <input type="date" />

      <label>Message</label>
      <textarea rows="4"></textarea>

      <button type="submit">Submit Request</button>
    </form>
  </section>

</body>
</html>
